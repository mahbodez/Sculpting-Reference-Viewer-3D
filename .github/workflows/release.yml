name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            archive: ReferenceViewer-windows.zip
          - os: macos-13
            label: macOS Intel
            archive: ReferenceViewer-macos-intel.zip
          - os: macos-14
            label: macOS Apple Silicon
            archive: ReferenceViewer-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install .[release]

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm packaging/refview.spec

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ReferenceViewer.exe -DestinationPath ${{ matrix.archive }}

      - name: Package macOS archive
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Reference Viewer.app' '${{ matrix.archive }}'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --generate-notes --verify-tag