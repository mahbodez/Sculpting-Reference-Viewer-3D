# conda env create -f environment.yml
#
# numpy, PySide6 and PyOpenGL are installed with pip rather than conda: the
# pip wheels bundle their own OpenBLAS and Qt runtimes, which avoids the
# mismatched-DLL problems that a mixed conda/pip stack runs into on Windows.
name: refview
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy>=1.24
      - PySide6>=6.6,<6.8
      - PyOpenGL>=3.1.7
      - pytest>=7.4
