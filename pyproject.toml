[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refview"
version = "1.2.0"
description = "A 3D reference viewer for clay sculpting: matcaps, shading modes and on-model measurements."
readme = "README.md"
requires-python = ">=3.11"  # tomllib, used to read this file back at runtime
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    # Qt 6.8+ needs a newer MSVC runtime than many Windows machines carry.
    "PySide6>=6.6,<6.8",
    "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
# Pillow lets PyInstaller convert the PNG icon into .ico/.icns at build time.
release = ["pyinstaller>=6.10,<7", "pillow>=10.0"]

[project.scripts]
refview = "refview.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["N802"]  # Qt event handlers use camelCase by contract.
