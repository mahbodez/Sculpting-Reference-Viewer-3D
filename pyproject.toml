[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refview"
version = "2.9.0"
description = "A 3D reference viewer for artists"
readme = "README.md"
requires-python = ">=3.11"  # tomllib, used to read this file back at runtime
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    # Qt 6.8+ needs a newer MSVC runtime than many Windows machines carry.
    "PySide6>=6.6,<6.8",
    "PyOpenGL>=3.1.7",
    # Root certificates for the release check: a frozen app, and Python on a
    # Mac, cannot otherwise verify GitHub's certificate.
    "certifi>=2024.2.2",
    # HDRIs come as OpenEXR, whose usual PIZ compression is not worth
    # reimplementing; Radiance .hdr is read without it.
    "OpenEXR>=3.3",
    # The path tracer's kernels are compiled to machine code by numba; its
    # llvmlite wheel carries its own LLVM, so nothing else need be installed.
    "numba>=0.67",
    # Intel Open Image Denoise, on the CPU everywhere, on CUDA wherever an
    # NVIDIA driver is present and on Metal on a Mac.
    "mitsuba-oidn>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
# Pillow lets PyInstaller convert the PNG icon into .ico/.icns at build time.
release = ["pyinstaller>=6.10,<7", "pillow>=10.0"]

[project.scripts]
refview = "refview.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The shaders are read at run time from beside the renderer.
refview = ["render/glsl/*.glsl", "render/glsl/*.vert", "render/glsl/*.frag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["N802"]  # Qt event handlers use camelCase by contract.
